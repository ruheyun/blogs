<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>个人博客</title>
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <link rel="icon" href="static/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon" />
    
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
    
    <style>
        .sidebar .app-sub-sidebar li::before {
            content: none !important;
        }
        .sidebar .app-sub-sidebar {
            list-style: none !important;
        }
        .sidebar-nav li.active > ul > li::before {
            content: none !important;
        }

        /* ========== 封面：壁纸 文字优化 ========== */
        section.cover {
            background: linear-gradient(rgba(20, 20, 50, .15), rgba(20, 20, 50, .25)),
                        url('static/bg.png') center / cover no-repeat !important;
            animation: none !important;
        }

        section.cover h1,
        section.cover blockquote p,
        section.cover ul {
            color: #fff !important;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .45);
        }

        /* 头像 */
        section.cover img {
            width: 150px;
            height: 150px;
            border-radius: 20%;
            border: 4px solid rgba(255, 255, 255, .85);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
        }

        /* 标题 */
        section.cover h1 {
            font-size: 3.2rem !important;
            letter-spacing: .02em;
        }

        /* 标语 */
        section.cover blockquote p {
            font-size: 1.5rem !important;
        }

        /* 列表 */
        section.cover ul,
        section.cover ul li {
            font-size: 1.2rem !important;
            line-height: 1.9;
        }

        /* 按钮 */
        section.cover p a {
            border-radius: 999px;
            padding: .7em 2.6em;
            font-size: 1.15rem !important;
            transition: all .25s;
        }
        section.cover p a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .18);
        }
        /* 按钮：加深一档，白字更醒目 */
        section.cover p a:first-child {
            background: #5b8def;
            border-color: #5b8def;
            color: #fff;
            box-shadow: 0 6px 18px rgba(91, 141, 239, .45);
        }
    </style>
</head>

<body class="loading">
    <div id="app"></div>
    
    <script>
        window.$docsify = {
            name: 'ruheyun',
            repo: 'https://github.com/ruheyun',
            loadSidebar: true,
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md',
            },
            loadNavbar: true,
            coverpage: true,
            onlyCover: true,
            subMaxLevel: 3,
            mergeNavbar: true,
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索',              
                noData: '找不到结果',
                depth: 4,
                hideOtherSidebarContent: false,
                namespace: 'Ruheyun',
            },
        }
    </script>
    
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/emoji.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>

</html>
