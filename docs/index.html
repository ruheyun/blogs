<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>个人博客</title>
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon" />
    
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
    
    <style>
        .sidebar .app-sub-sidebar li::before {
            content: none !important;
        }
        .sidebar .app-sub-sidebar {
            list-style: none !important;
        }
        .sidebar-nav li.active > ul > li::before {
            content: none !important;
        }
    </style>
</head>

<body class="loading">
    <div id="app">加载中...</div>
    
    <script>
        window.$docsify = {
            name: 'ruheyun',
            repo: 'https://github.com/ruheyun',
            loadSidebar: true,
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md',
            },
            loadNavbar: true,
            coverpage: true,
            onlyCover: true,
            subMaxLevel: 3,
            mergeNavbar: true,
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索',              
                noData: '找不到结果',
                depth: 4,
                hideOtherSidebarContent: false,
                namespace: 'Ruheyun',
            },
        }
    </script>
    
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/emoji.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>

</html>
