<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>个人博客</title>
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <link rel="icon" href="static/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon" />
    
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
    <link rel="stylesheet" href="https://unpkg.com/docsify-giscus@1.0.0/dist/giscus.css">
    <link rel="stylesheet" href="static/custom.css">
</head>

<body class="loading">
    <div id="app"></div>
    
    <script>
        window.$docsify = {
            name: 'Ruheyun',
            repo: 'https://github.com/ruheyun',
            loadSidebar: true,
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md',
            },
            loadNavbar: true,
            coverpage: true,
            onlyCover: true,
            subMaxLevel: 3,
            mergeNavbar: true,
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索',              
                noData: '找不到结果',
                depth: 4,
                hideOtherSidebarContent: false,
                namespace: 'Ruheyun',
            },
            auto2top: true,
            giscus:{
                repo: "ruheyun/blogs",
                repoId: "R_kgDOSbTqiA",
                category: "Announcements",
                categoryId: "DIC_kwDOSbTqiM4DDa73",
                mapping: "url",
                reactionsEnabled: "0",
                strict: "1",
                emitMetadata: "0",
                inputPosition: "bottom",
                theme: "light",
                lang: "zh-CN",
                loading: "lazy",
            },
            formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
            plugins: [
                function(hook, vm) {
                    // hook.beforeEach(function(html) {

                    //     const file = vm.route.file || '';

                    //     if (file.includes('posts/')) {
                    //         html += '\n\n----\n\n> 🕒 本文最后更新：{docsify-updated}';
                    //     }
                    //     return html;
                    // });

                    hook.afterEach(function(html) {
                        return html + `
                            <footer class="site-footer">
                                <p>© 2022 - ${new Date().getFullYear()} Ruheyun. All rights reserved.</p>
                            </footer>
                            `
                    });
                }
            ],
            
        }
    </script>
    
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/emoji.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="https://unpkg.com/docsify-giscus@1.0.0/dist/docsify-giscus.min.js"></script>
</body>

</html>
